# =========================================================================
# Azure DevOps CI/CD Pipeline - Devsu Banking Microservices (.NET 9)
#
# Arquitectura del Pipeline:
#   1. CI: Integración Continua (Compilación, Pruebas Unitarias, de Arquitectura y de Integración con Testcontainers).
#   2. BuildAndPushContainers: Empaquetado y publicación de imágenes Docker en Azure Container Registry (ACR).
#   3. DeployProduction: Despliegue automatizado hacia el servidor de producción mediante SSH.
#
# Seguridad y Gestión de Secretos:
#   - Cero credenciales en código: Todas las conexiones sensibles se resuelven mediante Service Connections de Azure DevOps.
#   - Archivos de entorno sensibles protegidos mediante Azure DevOps Secure Files (devsu-prod.env).
# =========================================================================
name: $(date:yyyyMMdd)$(rev:.r)

trigger:
  branches:
    include:
      - main
      - dev
  paths:
    exclude:
      - 'README.md'
      - 'docs/**'
      - '*.md'

pr:
  branches:
    include:
      - main
      - dev

variables:
  dotnetVersion: '9.0.x'
  buildConfiguration: 'Release'
  imageRepositoryCliente: 'devsu-cliente-service'
  imageRepositoryCuenta: 'devsu-cuenta-service'
  dockerRegistryServiceConnection: 'devsu-acr-connection'
  sshServiceConnection: 'devsu-gcp-ssh-connection'
  tag: '$(Build.BuildId)'

stages:
  # =======================================================================
  # ETAPA 1: INTEGRACION CONTINUA (Build & Test)
  # =======================================================================
  - stage: CI
    displayName: 'Integracion Continua (Build & Test)'
    jobs:
      - job: BuildAndTest
        displayName: 'Compilar y Ejecutar Tests Automatizados'
        pool:
          name: 'LocalBuild'
        steps:
          - task: UseDotNet@2
            displayName: 'Instalar .NET SDK $(dotnetVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restaurar paquetes NuGet'
            inputs:
              command: 'restore'
              projects: '**/*.sln'

          - task: DotNetCoreCLI@2
            displayName: 'Compilar solucion (.NET 9 Release)'
            inputs:
              command: 'build'
              projects: '**/*.sln'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Pruebas de Arquitectura (NetArchTest)'
            inputs:
              command: 'test'
              projects: 'tests/ArchitectureTests/*.csproj'
              arguments: '--configuration $(buildConfiguration) --logger trx'
              publishTestResults: true

          - task: DotNetCoreCLI@2
            displayName: 'Pruebas Unitarias ClienteService'
            inputs:
              command: 'test'
              projects: 'tests/ClienteService.UnitTests/*.csproj'
              arguments: '--configuration $(buildConfiguration) --logger trx'
              publishTestResults: true

          - task: DotNetCoreCLI@2
            displayName: 'Pruebas Unitarias CuentaMovimientoService'
            inputs:
              command: 'test'
              projects: 'tests/CuentaMovimientoService.UnitTests/*.csproj'
              arguments: '--configuration $(buildConfiguration) --logger trx'
              publishTestResults: true

          - task: DotNetCoreCLI@2
            displayName: 'Pruebas de Integracion (Testcontainers, PostgreSQL 16 efimero)'
            inputs:
              command: 'test'
              projects: 'tests/CuentaMovimientoService.IntegrationTests/*.csproj'
              arguments: '--configuration $(buildConfiguration) --logger trx'
              publishTestResults: true

