services:
  postgres:
    image: postgres:16-alpine
    container_name: devsu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB_CLIENTES: ${POSTGRES_DB_CLIENTES:-devsu_clientes}
      POSTGRES_DB_CUENTAS: ${POSTGRES_DB_CUENTAS:-devsu_cuentas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db/00-init-databases.sh:/docker-entrypoint-initdb.d/00-init-databases.sh:ro
      - ./docker/init-db/sql:/docker-init-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devsu-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: devsu-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-devsu_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devsu-network

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:8.2
    container_name: devsu-aspire-dashboard
    restart: unless-stopped
    ports:
      - "18888:18888" # Dashboard Web UI
      - "4317:18889"  # OTLP gRPC endpoint (el contenedor escucha internamente en 18889)
      - "4318:18890"  # OTLP HTTP endpoint (el contenedor escucha internamente en 18890)
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    networks:
      - devsu-network

  cliente-service:
    build:
      context: .
      dockerfile: src/ClienteService/Dockerfile
    image: devsu-cliente-service:latest
    container_name: devsu-cliente-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgresDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB_CLIENTES:-devsu_clientes};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__User: "${RABBITMQ_DEFAULT_USER:-devsu_admin}"
      RabbitMq__Password: "${RABBITMQ_DEFAULT_PASS}"
      CuentaMovimientoService__BaseUrl: "http://cuenta-service:8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      OTEL_SERVICE_NAME: "cliente-service"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - devsu-network

  cuenta-service:
    build:
      context: .
      dockerfile: src/CuentaMovimientoService/Dockerfile
    image: devsu-cuenta-service:latest
    container_name: devsu-cuenta-service
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__PostgresDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB_CUENTAS:-devsu_cuentas};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__User: "${RABBITMQ_DEFAULT_USER:-devsu_admin}"
      RabbitMq__Password: "${RABBITMQ_DEFAULT_PASS}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      OTEL_SERVICE_NAME: "cuenta-service"
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    networks:
      - devsu-network

  # Visor web de base de datos - devsu_clientes (Puerto 8089)
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: devsu-pgweb
    restart: unless-stopped
    ports:
      - "8089:8081"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_CLIENTES:-devsu_clientes}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devsu-network

  # Visor web de base de datos - devsu_cuentas (Puerto 8090)
  pgweb-cuentas:
    image: sosedoff/pgweb:latest
    container_name: devsu-pgweb-cuentas
    restart: unless-stopped
    ports:
      - "8090:8081"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_CUENTAS:-devsu_cuentas}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devsu-network

volumes:
  postgres_data:
    name: devsu_postgres_data
  rabbitmq_data:
    name: devsu_rabbitmq_data

networks:
  devsu-network:
    name: devsu_network
    driver: bridge
